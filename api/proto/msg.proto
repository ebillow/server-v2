syntax = "proto3";

option optimize_for = LITE_RUNTIME;
option go_package = "./pb";
//---------------说明---------------------------
//各个模块消息
//----------------------------------------------

//import "msg_common.proto";
package pb;

message C2SEcho{
	uint64 ID = 1;
	string Name = 2;
	uint32 Level = 3;
	uint32 Exp = 4;
	string Data = 5;
	sint64 Time = 6;
}

message S2CEcho{
	uint64 ID = 1;
	string Name = 2;
	uint32 Level = 3;
	uint32 Exp = 4;
	string Data = 5;
	sint64 CliTime = 6;
	sint64 SrvTime = 7;
}

message S2SEcho{
	uint64 ID = 1;
	string Name = 2;
	uint32 Level = 3;
	uint32 Exp = 4;
	string Data = 5;
	sint64 Time = 6;
}