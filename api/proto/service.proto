syntax = "proto3";

option go_package = "./pb";
import "msg_common.proto";
package pb;

message NatsMsg{
  uint32 MsgID = 1;
  bytes Data = 2;

  sint32 SerID = 3;
  Server SerType = 4;
  uint64 RoleID = 5;
  uint64 SesID = 6;
  bool Forward = 7;
}

message LogMsg {
  string  EventID = 1;            // UUID，用于去重
  int64   RoleID = 2;             // 用户ID
  string  Type = 3;               // 事件类型，如 "login", "level_up"
  int64   TimeStamp = 4;          // Unix 时间戳 (毫秒/秒)
  bytes   Payload = 5;
}

message SrvMsg{
    uint32  ID = 2;
    bytes 	Msg = 3;
		uint64 	RoleID = 4;
}

message SrvMsgs{
	repeated SrvMsg Msgs = 1;
}

service SrvService {
   rpc SrvSrv(stream SrvMsgs) returns (stream SrvMsgs);
}
